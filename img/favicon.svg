<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f4143"/>
      <stop offset="1" stop-color="#08292a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8c95a"/>
      <stop offset="1" stop-color="#e0a422"/>
    </linearGradient>
  </defs>
  <!-- brand tile -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#tile)"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="11" fill="none" stroke="#f5b937" stroke-opacity=".55" stroke-width="1.4"/>
  <!-- 8-point khatim star (two overlapping squares) -->
  <g fill="url(#gold)">
    <polygon points="32,11 53,32 32,53 11,32"/>
    <polygon points="17.15,17.15 46.85,17.15 46.85,46.85 17.15,46.85"/>
  </g>
  <!-- centre rosette -->
  <circle cx="32" cy="32" r="7.5" fill="url(#tile)"/>
  <polygon points="32,25.5 38.5,32 32,38.5 25.5,32" fill="url(#gold)"/>
  <circle cx="32" cy="32" r="2.4" fill="#08292a"/>
</svg>
